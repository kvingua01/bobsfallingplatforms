
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Bob's Falling Platforms</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10131a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1000px;
  margin: auto;
}

h2 { margin: 0; font-size: 22px; }

#status { color: #ddd; }

#gameArea {
  position: relative;
  width: min(100%, 1000px);
  margin: auto;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #555;
  border-radius: 8px;
  background: #172131;
}

#overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.45);
  pointer-events: none;
}

#overlayText {
  padding: 20px 35px;
  background: rgba(0,0,0,.85);
  border-radius: 12px;
  font-size: clamp(18px, 4vw, 32px);
  font-weight: bold;
}

#instructions {
  padding: 15px;
  color: #bbb;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h2>Bob's Falling Platforms</h2>
  <div id="status">Connecting...</div>
</header>

<div id="gameArea">
  <canvas id="game" width="1000" height="760"></canvas>
  <div id="overlay">
    <div id="overlayText"></div>
  </div>
</div>

<div id="instructions">
  A / D or Arrow Keys = Move
  • W / Up / Space = Jump
  • Tiles break after 3 damage stages
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");

let myId = null;
let players = {};
let tiles = [];
let round = 1;
let phase = "waiting";
let roundMessage = "";

const keys = {
  left: false,
  right: false,
  jump: false
};

let jumpSent = false;

socket.on("connect", () => {
  status.textContent = "Connected";
});

socket.on("disconnect", () => {
  status.textContent = "Disconnected";
  showOverlay("Disconnected — reconnecting...");
});

socket.on("init", data => {
  myId = data.id;
  round = data.round;
  roundMessage = "";
  updateOverlay();
});

socket.on("state", data => {
  players = data.players;
  tiles = data.tiles;
  round = data.round;
  phase = data.phase;

  const count = Object.keys(players).length;
  status.textContent =
    `Round ${round} • Players: ${count}`;

  updateOverlay();
});

socket.on("roundOver", data => {
  if (data.winnerId === myId) {
    roundMessage = "YOU WIN!";
  } else if (data.winnerId) {
    roundMessage = "ROUND OVER!";
  } else {
    roundMessage = "ROUND OVER!";
  }

  updateOverlay();
});

socket.on("newRound", data => {
  round = data.round;
  roundMessage = "";
  updateOverlay();
});

function showOverlay(message) {
  overlay.style.display = "flex";
  overlayText.textContent = message;
}

function hideOverlay() {
  overlay.style.display = "none";
}

function updateOverlay() {
  if (!socket.connected) {
    showOverlay("Disconnected — reconnecting...");
    return;
  }

  if (!myId) {
    showOverlay("Connecting...");
    return;
  }

  const me = players[myId];

  if (!me || !me.inRound) {
    showOverlay("SPECTATING — WAIT FOR NEXT ROUND");
    return;
  }

  if (phase === "ending") {
    showOverlay(roundMessage || "ROUND OVER!");
    return;
  }

  if (!me.alive) {
    showOverlay("ELIMINATED — WAIT FOR NEXT ROUND");
    return;
  }

  hideOverlay();
}

window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();

  if (key === "a" || key === "arrowleft") {
    keys.left = true;
    e.preventDefault();
  }

  if (key === "d" || key === "arrowright") {
    keys.right = true;
    e.preventDefault();
  }

  if (
    key === "w" ||
    key === "arrowup" ||
    e.code === "Space"
  ) {
    keys.jump = true;
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();

  if (key === "a" || key === "arrowleft") {
    keys.left = false;
  }

  if (key === "d" || key === "arrowright") {
    keys.right = false;
  }

  if (
    key === "w" ||
    key === "arrowup" ||
    e.code === "Space"
  ) {
    keys.jump = false;
    jumpSent = false;
  }
});

window.addEventListener("blur", () => {
  keys.left = false;
  keys.right = false;
  keys.jump = false;
  jumpSent = false;
});

setInterval(() => {
  let jump = false;

  if (keys.jump && !jumpSent) {
    jump = true;
    jumpSent = true;
  }

  if (socket.connected) {
    socket.emit("input", {
      left: keys.left,
      right: keys.right,
      jump
    });
  }
}, 1000 / 30);

function tileColor(damage) {
  if (damage === 0) return "#41b883";
  if (damage === 1) return "#f1c40f";
  if (damage === 2) return "#e67e22";
  return "#e74c3c";
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(
    0, 0, 0, canvas.height
  );

  gradient.addColorStop(0, "#24344d");
  gradient.addColorStop(1, "#10141d");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1000, 760);
}

function drawTiles() {
  for (const tile of tiles) {
    if (tile.broken) continue;

    ctx.fillStyle = tileColor(tile.damage);

    ctx.fillRect(
      tile.x + 1,
      tile.y,
      tile.width - 2,
      tile.height
    );

    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fillRect(tile.x + 2, tile.y + 2, 36, 4);

    ctx.strokeStyle = "#263238";
    ctx.lineWidth = 1;
    ctx.strokeRect(
      tile.x + 1,
      tile.y,
      tile.width - 2,
      tile.height
    );

    if (tile.damage >= 2) {
      ctx.strokeStyle = "#513322";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tile.x + 10, tile.y + 2);
      ctx.lineTo(tile.x + 20, tile.y + 12);
      ctx.lineTo(tile.x + 15, tile.y + 22);
      ctx.stroke();
    }
  }
}

function drawPlayer(p) {
  if (!p.alive || !p.inRound) return;

  ctx.fillStyle = p.color;
  ctx.fillRect(p.x, p.y, p.width, p.height);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x, p.y, p.width, p.height);

  // Eyes
  ctx.fillStyle = "white";
  ctx.fillRect(p.x + 5, p.y + 10, 7, 8);
  ctx.fillRect(p.x + 17, p.y + 10, 7, 8);

  // Pupils
  ctx.fillStyle = "#111";
  ctx.fillRect(p.x + 8, p.y + 13, 3, 4);
  ctx.fillRect(p.x + 20, p.y + 13, 3, 4);

  if (p.id === myId) {
    ctx.fillStyle = "white";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      "YOU",
      p.x + p.width / 2,
      p.y - 10
    );
  }
}

function drawLabels() {
  const labels = [
    { y: 220, name: "LAYER 1" },
    { y: 430, name: "LAYER 2" },
    { y: 640, name: "FINAL LAYER" }
  ];

  ctx.font = "bold 15px Arial";
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,.6)";

  for (const label of labels) {
    ctx.fillText(label.name, 92, label.y + 17);
  }
}

function draw() {
  drawBackground();
  drawLabels();
  drawTiles();

  for (const id in players) {
    drawPlayer(players[id]);
  }

  ctx.fillStyle = "rgba(231,76,60,.18)";
  ctx.fillRect(0, 720, 1000, 40);

  ctx.fillStyle = "white";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText(
    "FALL BELOW THE FINAL PLATFORM = OUT",
    500,
    747
  );

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
